<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>wland</title>
<style>
  html, body { margin: 0; background: #15171c; color: #d8dbe2; font: 13px/1.4 ui-monospace, monospace; }
  /* the wland container: its client size is the output size apps see. It
     fills the viewport (run-poc: 1600x1100), which the phases' drags need:
     a window moved or grown past the container's edge is clipped. */
  #desktop { position: fixed; inset: 0; overflow: hidden; background: #1e222b; }
  #status { position: fixed; left: 0; bottom: 0; margin: 0; white-space: pre-wrap; opacity: 0.5; pointer-events: none; z-index: 1000; }
</style>
</head>
<body>
<div id="desktop"></div>
<pre id="status"></pre>
<script type="module" src="/page.js"></script>
</body>
</html>
